[server]
bind_address = "0.0.0.0"
bind_port = 1080
max_connections = 1000
handshake_timeout_ms = 10000
# This image listens on the container interface, but authentication is mandatory.
allow_unsafe_public_proxy = false

[server.tls]
enabled = false
require_client_auth = false
alpn_protocols = []
handshake_timeout_ms = 10000

[server.pool]
# Generic SOCKS tunnels are not safely reusable unless no application bytes flowed.
# Keep pooling disabled unless you have tested your workload explicitly.
enabled = false
max_idle_per_dest = 4
max_total_idle = 100
idle_timeout_secs = 90
connect_timeout_ms = 5000

[server.resolver]
timeout_ms = 5000
cache_ttl_secs = 30
cache_max_entries = 4096
max_concurrent_lookups = 128

[auth]
client_method = "none"
socks_method = "userpass"

[[auth.users]]
username = "proxy"
password = "${RUSTSOCKS_PROXY_PASSWORD}"

[auth.pam]
username_service = "rustsocks"
address_service = "rustsocks-client"
default_user = "anonymous"
default_ruser = "anonymous"
verbose = false
verify_service = false

[auth.gssapi]
service_name = "socks"
protection_level = "integrity"
verbose = false

[logging]
level = "info"
format = "pretty"

[acl]
enabled = true
config_file = "/etc/rustsocks/acl.toml"
watch = true
anonymous_user = "anonymous"

[sessions]
enabled = true
storage = "sqlite"
database_url = "sqlite:///data/sessions.db"
batch_size = 100
batch_interval_ms = 1000
batch_queue_capacity = 10000
history_max_entries = 100000
retention_days = 90
cleanup_interval_hours = 24
traffic_update_packet_interval = 10
traffic_queue_capacity = 10000
stats_window_hours = 24
stats_api_enabled = true
stats_api_bind_address = "0.0.0.0"
stats_api_port = 9090
swagger_enabled = true
dashboard_enabled = true
base_path = "/rustsocks"

[sessions.dashboard_auth]
enabled = true
altcha_enabled = true
# Docker quick-start serves plain HTTP on loopback by default. Set true when
# terminating HTTPS in front of RustSocks.
cookie_secure = false
session_secret = "${RUSTSOCKS_DASHBOARD_SESSION_SECRET}"
session_duration_hours = 24

[[sessions.dashboard_auth.users]]
username = "admin"
password = "${RUSTSOCKS_DASHBOARD_PASSWORD}"
[[sessions.dashboard_auth.roles]]
username = "admin"
role = "admin"

[metrics]
enabled = true
storage = "memory"
retention_hours = 24
cleanup_interval_hours = 6
collection_interval_secs = 5

[telemetry]
enabled = true
max_events = 256
retention_hours = 6

[qos]
enabled = false
algorithm = "htb"

[qos.htb]
global_bandwidth_bytes_per_sec = 125000000
guaranteed_bandwidth_bytes_per_sec = 131072
max_bandwidth_bytes_per_sec = 12500000
burst_size_bytes = 1048576
refill_interval_ms = 50
fair_sharing_enabled = true
rebalance_interval_ms = 100
idle_timeout_secs = 5

[qos.connection_limits]
max_connections_per_user = 20
max_connections_global = 10000
