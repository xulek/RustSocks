[global]
default_policy = "block"

# Docker's default authenticated proxy principal. Explicit deny rules are
# intentionally higher priority than the public-Internet allow rule and are
# also rechecked after DNS resolution.
[[users]]
username = "proxy"
groups = []

[[users.rules]]
action = "block"
description = "Block loopback, private, link-local and special-use networks"
destinations = [
  "0.0.0.0/8",
  "10.0.0.0/8",
  "100.64.0.0/10",
  "127.0.0.0/8",
  "169.254.0.0/16",
  "172.16.0.0/12",
  "192.0.0.0/24",
  "192.0.2.0/24",
  "192.168.0.0/16",
  "198.18.0.0/15",
  "198.51.100.0/24",
  "203.0.113.0/24",
  "224.0.0.0/4",
  "240.0.0.0/4",
  "::/128",
  "::1/128",
  "fc00::/7",
  "fe80::/10",
  "ff00::/8",
  "2001:db8::/32"
]
ports = ["*"]
protocols = ["both"]
priority = 1000

[[users.rules]]
action = "allow"
description = "Allow public Internet destinations"
destinations = ["*"]
ports = ["*"]
protocols = ["both"]
priority = 10
