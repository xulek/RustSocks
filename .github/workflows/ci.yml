name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-linux:
    name: Rust / Linux
    runs-on: ubuntu-latest
    services:
      # Real Redis for the shared policy-usage backend tests (tests/policy_usage_redis.rs).
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpam0g-dev libkrb5-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check default features
        run: cargo check --locked

      - name: Check all features
        run: cargo check --locked --all-features

      - name: Check no default features
        run: cargo check --locked --no-default-features

      - name: Clippy default features
        run: cargo clippy --locked -- -D warnings

      - name: Clippy all features
        run: cargo clippy --locked --all-features -- -D warnings

      - name: Clippy no default features
        run: cargo clippy --locked --no-default-features -- -D warnings

      - name: Test default features
        run: cargo test --locked --no-fail-fast

      - name: Test all features
        run: cargo test --locked --all-features --no-fail-fast

      - name: Test no default features
        run: cargo test --locked --no-default-features --no-fail-fast

  rust-windows:
    name: Rust / Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check default features
        run: cargo check --locked

      - name: Check all features
        run: cargo check --locked --all-features

      - name: Check no default features
        run: cargo check --locked --no-default-features

      - name: Clippy default features
        run: cargo clippy --locked -- -D warnings

      - name: Clippy all features
        run: cargo clippy --locked --all-features -- -D warnings

      - name: Clippy no default features
        run: cargo clippy --locked --no-default-features -- -D warnings

      - name: Test default features
        run: cargo test --locked --no-fail-fast

      - name: Test all features
        run: cargo test --locked --all-features --no-fail-fast

      - name: Test no default features
        run: cargo test --locked --no-default-features --no-fail-fast
