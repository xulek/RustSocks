name: Release

# Publishes binaries (Linux, Windows) with checksums and a container image to GHCR when a
# version tag is pushed, e.g. `git tag v0.10.0 && git push origin v0.10.0`.
# Running it manually (workflow_dispatch) builds everything but never publishes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag and tests
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        id: version
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          echo "version=${cargo_version}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${cargo_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_version}"
            exit 1
          fi

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpam0g-dev libkrb5-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test (all features)
        run: cargo test --locked --all-features --no-fail-fast

  dashboard:
    name: Build dashboard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
          if-no-files-found: error

  binaries:
    name: Binary / ${{ matrix.name }}
    needs: [verify, dashboard]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on 22.04 so the binary runs on any glibc >= 2.35 distribution.
          - name: linux-x86_64
            os: ubuntu-22.04
            exe: rustsocks
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            exe: rustsocks.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpam0g-dev libkrb5-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --all-features

      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard-dist

      - name: Package
        shell: bash
        run: |
          name="rustsocks-${VERSION}-${{ matrix.name }}"
          mkdir -p "dist/${name}/dashboard"
          cp "target/release/${{ matrix.exe }}" "dist/${name}/"
          cp -r dashboard-dist "dist/${name}/dashboard/dist"
          cp -r config "dist/${name}/config"
          cp LICENSE README.md "dist/${name}/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "${name}.zip" "${name}" > /dev/null
            sha256sum "${name}.zip" > "${name}.zip.sha256"
          else
            tar -czf "${name}.tar.gz" "${name}"
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  image:
    name: Container image
    needs: [verify, dashboard]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=dry-run,enable=${{ github.ref_type != 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attach an SBOM and build provenance attestation to the image.
          sbom: true
          provenance: mode=max

  release:
    name: Publish release
    needs: [binaries, image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Combine checksums
        working-directory: dist
        run: |
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
