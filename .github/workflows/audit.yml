name: Supply chain

# Checks dependencies against the RustSec advisory database, licence policy and allowed
# sources. It also runs weekly because new advisories appear without any change to this repo.
on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: Check advisories, licenses, bans and sources
        run: cargo deny --all-features check
