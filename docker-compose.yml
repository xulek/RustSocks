services:
  rustsocks:
    build:
      context: .
      dockerfile: Dockerfile
    image: rustsocks:latest
    container_name: rustsocks-proxy
    restart: unless-stopped

    ports:
      # Loopback-only by default. Change deliberately if remote clients need access.
      - "127.0.0.1:1080:1080"
      - "127.0.0.1:9090:9090"

    volumes:
      # A named config volume is initialized from the image and remains writable
      # by the non-root rustsocks user, including dashboard config updates.
      - rustsocks-config:/etc/rustsocks
      - ./docker/configs/pam.d/rustsocks:/etc/pam.d/rustsocks:ro
      - ./docker/configs/pam.d/rustsocks-client:/etc/pam.d/rustsocks-client:ro
      - rustsocks-data:/data
      - rustsocks-logs:/var/log/rustsocks

    environment:
      - RUSTSOCKS_CONFIG=/etc/rustsocks/rustsocks.toml
      - RUSTSOCKS_DB_PATH=/data/sessions.db
      - RUSTSOCKS_PROXY_PASSWORD=${RUSTSOCKS_PROXY_PASSWORD:?Set RUSTSOCKS_PROXY_PASSWORD}
      - RUSTSOCKS_DASHBOARD_PASSWORD=${RUSTSOCKS_DASHBOARD_PASSWORD:?Set RUSTSOCKS_DASHBOARD_PASSWORD}
      - RUSTSOCKS_DASHBOARD_SESSION_SECRET=${RUSTSOCKS_DASHBOARD_SESSION_SECRET:?Set a random 32+ byte session secret}
      - TZ=${TZ:-UTC}

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    networks:
      - rustsocks-net

volumes:
  rustsocks-config:
    driver: local
  rustsocks-data:
    driver: local
  rustsocks-logs:
    driver: local

networks:
  rustsocks-net:
    driver: bridge
