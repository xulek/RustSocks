site_name: RustSocks Documentation
site_description: High-performance SOCKS5 proxy with ACLs, sessions, metrics, and a modern web dashboard.
site_url: https://xulek.github.io/RustSocks/
repo_name: xulek/RustSocks
repo_url: https://github.com/xulek/RustSocks
edit_uri: edit/master/docs/
copyright: Copyright &copy; RustSocks contributors &middot; MIT License

nav:
  - Home: index.md
  - Getting Started:
      - Quick Start: usage/quick-start.md
      - Docker Deployment: usage/docker.md
  - UI & Dashboard:
      - Overview: ui/overview.md
      - Authentication: guides/dashboard-authentication.md
      - SMTP Configuration: guides/smtp-configuration.md
  - Configuration:
      - rustsocks.toml: config/rustsocks.md
      - acl.toml: config/acl.md
      - Dynamic Policy Engine: config/policy-engine.md
  - Usage & Examples:
      - Common Scenarios: usage/examples.md
  - Guides:
      - Web Dashboard: guides/web-dashboard.md
      - Base Path Deployment: guides/building-with-base-path.md
      - LDAP Groups: guides/ldap-groups.md
      - Active Directory: guides/active-directory.md
      - Testing: guides/testing.md
      - Metrics & Audit Log: guides/metrics-and-audit.md
  - References:
      - Project README: references/project-readme.md
      - Developer Guide: references/claude.md
      - Dashboard README: references/dashboard-readme.md
      - Load Testing Manual: references/loadtests-manual.md
  - Technical:
      - Architecture: technical/architecture.md
      - ACL Engine: technical/acl-engine.md
      - Connection Pool: technical/connection-pool.md
      - Protocol & TLS: technical/protocol.md
      - PAM Authentication: technical/pam-authentication.md
      - Session Management: technical/session-management.md

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/logo.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - content.tooltips

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/xulek/RustSocks
      name: RustSocks on GitHub
