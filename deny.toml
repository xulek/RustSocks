# cargo-deny configuration (cargo-deny 0.20)
# https://embarkstudios.github.io/cargo-deny/
#
# Run locally with:  cargo deny --all-features check
# CI runs it on dependency changes and weekly (.github/workflows/audit.yml).

[graph]
all-features = true

[advisories]
# Every ignore needs a reason and should be removed once the dependency is updated.
ignore = [
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is unmaintained. Compile-time only (mysql-common-derive, via mysql_async with the `database` feature); not linked into the binary." },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is unmaintained. Pulled in only by mysql_async (`database` feature) for PEM parsing; no known vulnerability. Drop once mysql_async moves to rustls-pki-types." },
]

[licenses]
# Only permissive licences. Copyleft (GPL/AGPL/LGPL) must be a conscious decision.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "0BSD",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[bans]
# Duplicate versions are common in large trees; surface them without failing the build.
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
